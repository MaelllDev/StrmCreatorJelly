name: Release

# Dispara automaticamente quando uma tag nova (ex.: v0.2.4) é enviada.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Precisa dos dois SDKs: net9.0 (jf10) e net10.0 (jf12)
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build jf10 (Jellyfin 10.11)
        run: dotnet build -c Release -p:JellyfinTarget=jf10 -v q

      - name: Build jf12 (Jellyfin 12)
        run: dotnet build -c Release -p:JellyfinTarget=jf12 -v q

      # Organiza os artifacts: uma pasta por linha com DLL + icone,
      # igual ao layout dos plugins instalados pelo catalogo.
      - name: Organizar artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p "release/StrmCreator-${VERSION}/jf10" "release/StrmCreator-${VERSION}/jf12"
          cp bin/Release/net9.0/Jellyfin.Plugin.StrmCreator.dll  "release/StrmCreator-${VERSION}/jf10/Jellyfin.Plugin.StrmCreator-jf10.dll"
          cp bin/Release/net10.0/Jellyfin.Plugin.StrmCreator.dll "release/StrmCreator-${VERSION}/jf12/Jellyfin.Plugin.StrmCreator-jf12.dll"
          cp plugins/icon.png "release/StrmCreator-${VERSION}/jf10/icon.png"
          cp plugins/icon.png "release/StrmCreator-${VERSION}/jf12/icon.png"
          cp LICENSE NOTICE README.md how-to-install.md "release/StrmCreator-${VERSION}/"
          cd release && zip -r "../StrmCreator-${VERSION}.zip" "StrmCreator-${VERSION}"

      # Publica a release anexando os 3 arquivos (recria se já existir)
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="StrmCreator-${VERSION}.zip"
          JF10="release/StrmCreator-${VERSION}/jf10/Jellyfin.Plugin.StrmCreator-jf10.dll"
          JF12="release/StrmCreator-${VERSION}/jf12/Jellyfin.Plugin.StrmCreator-jf12.dll"
          gh release delete "${GITHUB_REF_NAME}" --yes --cleanup-tag || true
          gh release create "${GITHUB_REF_NAME}" \
            --title "Strm Creator ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${ZIP}" "${JF10}" "${JF12}"

      # Gera/atualiza o catalogo (manifest.json) no branch "catalog".
      # E isso que faz o plugin aparecer no Catalogo do Painel, com foto,
      # meta e atualizacao automatica - igual aos plugins oficiais.
      - name: Atualizar catalogo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/MaelllDev/StrmCreatorJelly/releases/download/${TAG}"
          DIR="release/StrmCreator-${VERSION}"

          CHK10=$(sha256sum "${DIR}/jf10/Jellyfin.Plugin.StrmCreator-jf10.dll" | cut -d' ' -f1)
          CHK12=$(sha256sum "${DIR}/jf12/Jellyfin.Plugin.StrmCreator-jf12.dll" | cut -d' ' -f1)
          CHKZIP=$(sha256sum "StrmCreator-${VERSION}.zip" | cut -d' ' -f1)

          # Gera o entry do manifest e salva o icone em /tmp ANTES de trocar
          # de branch (a troca para o orphan apaga a arvore de arquivos).
          jq -n \
            --arg version "${VERSION}" \
            --arg tag "${TAG}" \
            --arg chk10 "${CHK10}" --arg chk12 "${CHK12}" --arg chkzip "${CHKZIP}" \
            --arg url10 "${BASE}/Jellyfin.Plugin.StrmCreator-jf10.dll" \
            --arg url12 "${BASE}/Jellyfin.Plugin.StrmCreator-jf12.dll" \
            --arg urlzip "${BASE}/StrmCreator-${VERSION}.zip" \
            '{name: "Strm Creator",
              guid: "e1f2a3b4-c5d6-4e7f-8a9b-0c1d2e3f4a5b",
              overview: "Cria arquivos .strm direto pela interface: escolha a biblioteca, navegue as pastas e cole o link de stream.",
              description: "Adiciona um botao na pagina de detalhes para criar arquivos .strm: escolha a biblioteca, navegue pelas pastas, crie uma pasta nova, nomeie o arquivo (modo serie com S01E01 e lote de episodios) e cole o link de stream. Codigo aberto (Apache 2.0) - fork deve manter creditos e link do repositorio oficial.",
              owner: "MaelllDev",
              category: "General",
              imageUrl: "https://raw.githubusercontent.com/MaelllDev/StrmCreatorJelly/main/plugins/icon.png",
              versions: [
                {version: $version, changelog: ("Release " + $tag), targetAbi: "10.11.0.0", sourceUrl: ("https://github.com/MaelllDev/StrmCreatorJelly/tree/" + $tag), url: $url10, checksum: $chk10, timestamp: (now | todateiso8601)},
                {version: $version, changelog: ("Release " + $tag), targetAbi: "12.0.0.0", sourceUrl: ("https://github.com/MaelllDev/StrmCreatorJelly/tree/" + $tag), url: $url12, checksum: $chk12, timestamp: (now | todateiso8601)}
              ]}' > /tmp/entry.json
          cat /tmp/entry.json
          cp plugins/icon.png /tmp/icon.png

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin catalog >/dev/null 2>&1; then
            git fetch origin catalog
            git checkout -B catalog origin/catalog
          else
            git checkout --orphan catalog
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp /tmp/icon.png icon.png
          jq '.versions = [.versions[] | select(.targetAbi != "12.0.0.0")]' /tmp/entry.json > manifest-10.11.json
          jq '.versions = [.versions[] | select(.targetAbi != "10.11.0.0")]' /tmp/entry.json > manifest-12.json
          cp /tmp/entry.json manifest.json
          git add manifest.json manifest-12.json manifest-10.11.json icon.png
          git commit -m "Catalog: release ${TAG}"
          git push origin catalog
